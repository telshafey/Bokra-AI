<!DOCTYPE html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokra HRMS AI-Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
            },
            colors: {
              primary: {
                50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                900: 'rgb(var(--color-primary-900) / <alpha-value>)',
                950: 'rgb(var(--color-primary-950) / <alpha-value>)',
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --color-primary-50: 240 249 255; /* sky-50 */
        --color-primary-100: 224 242 254; /* sky-100 */
        --color-primary-200: 186 230 253; /* sky-200 */
        --color-primary-300: 125 211 252; /* sky-300 */
        --color-primary-400: 59 179 247; /* sky-400 */
        --color-primary-500: 14 165 233; /* sky-500 */
        --color-primary-600: 2 132 199; /* sky-600 */
        --color-primary-700: 3 105 161; /* sky-700 */
        --color-primary-800: 7 89 133; /* sky-800 */
        --color-primary-900: 12 74 110; /* sky-900 */
        --color-primary-950: 8 51 68; /* sky-950 */
      }
      .dragging {
        opacity: 0.5;
        border: 2px dashed #38bdf8; /* light-blue-400 */
      }
      .drop-target {
        background-color: rgb(var(--color-primary-100));
        border: 2px dashed rgb(var(--color-primary-500));
      }
      .dark .drop-target {
        background-color: rgb(var(--color-primary-900));
      }
      @keyframes fade-in-right {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .animate-fade-in-right {
        animation: fade-in-right 0.5s ease-out forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.15.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.1.2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
